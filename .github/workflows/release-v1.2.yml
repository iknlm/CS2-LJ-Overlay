name: Publish verified v1.2 Windows x64
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.2.yml'
      - 'release-v1.2.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1.2
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'iknlm/CS2-LJ-Overlay'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify source matches locally tested release gate
        shell: pwsh
        run: python verify_release_gate.py
      - name: Inspect existing publication
        id: publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_release.py --probe-state >> $env:GITHUB_OUTPUT
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: steps.publication.outputs.published != 'true'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build Windows x64 GUI
        if: steps.publication.outputs.published != 'true'
        shell: cmd
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: BUILD_EXE.bat < nul
      - name: Check parser and core models on the release runner
        if: steps.publication.outputs.published != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 analysis_test.cpp -o analysis_test.exe
          ./analysis_test.exe
          g++ -std=c++20 -O2 review_model_test.cpp -o review_model_test.exe
          ./review_model_test.exe
          g++ -std=c++20 -O2 -DLJ_TEST lj_overlay.cpp -o lj_test.exe
          ./lj_test.exe sample_jump_console.log
      - name: Check actual EXE without compiler directories in PATH
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: ./VERIFY_RELEASE_RUNTIME.ps1
      - name: Build and verify the player ZIP and manifests
        if: steps.publication.outputs.published != 'true'
        shell: pwsh
        run: python prepare_release.py --output dist
      - name: Publish checked assets or verify the unchanged published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: python publish_release.py
      - name: Preserve exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.2-build-test-release-evidence
          path: |
            BUILD_LOG.txt
            reports/
            dist/
          if-no-files-found: error
